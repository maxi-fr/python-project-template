[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "{{cookiecutter.project_slug}}"
version = "0.1.0"
description = "{{cookiecutter.project_description}}"
authors = [
    {name = "{{cookiecutter.author_name}}", email = "{{cookiecutter.author_email}}"}
]
readme = "README.md"
requires-python = ">={{cookiecutter.python_version}}"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "pre-commit>=3.0.0",
    "mypy>=1.0.0",
]

[tool.ruff]
line-length = {{cookiecutter.line_length}}
indent-width = 4
target-version = "py{{cookiecutter.python_version.replace('.', '')}}"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.mypy]
# The 'strict' flag is a shortcut for about 15 individual flags
strict = true

# If you want to be surgical instead of using 'strict = true', 
# these are the two specifically for your example:
disallow_untyped_defs = true          # Reports 'def f(x):' as an error
disallow_incomplete_defs = true       # Reports 'def f(x: int):' (missing return type)
check_untyped_defs = true             # Even if the 'def' is untyped, check the body